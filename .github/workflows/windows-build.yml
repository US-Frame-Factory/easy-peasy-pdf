name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs

      - name: Build installers
        run: npx tauri build --bundles msi,nsis

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: EasyPeasyPDF-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload setup.exe (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: EasyPeasyPDF-setup-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload portable exe + pdfium.dll
        uses: actions/upload-artifact@v4
        with:
          name: EasyPeasyPDF-portable
          path: |
            src-tauri/target/release/easy-peasy-pdf.exe
            src-tauri/pdfium/pdfium.dll
