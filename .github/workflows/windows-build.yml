name: Windows build

# Runs only when started by hand: Actions tab -> "Windows build" -> "Run workflow".
# Publishes a GitHub Release with the installers. If the TAURI_SIGNING_PRIVATE_KEY
# secret is set, the release is signed and includes latest.json, which installed
# copies of the app check to update themselves.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0). Leave empty for 0.2.<run number>."
        required: false
        default: ""
      notes:
        description: "What's new (shown in the release and the update prompt)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs

      - name: Set version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=$(node scripts/release-prep.mjs version "$INPUT_VERSION")" >> "$GITHUB_OUTPUT"

      - name: Build installers (signed)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles msi,nsis

      - name: Build installers (unsigned - add the TAURI_SIGNING_PRIVATE_KEY secret to enable updates)
        if: env.HAS_SIGNING_KEY != 'true'
        run: npx tauri build --bundles msi,nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect release files
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/release-prep.mjs collect "${{ steps.ver.outputs.version }}" && ls -la release

      - name: Upload installers (run artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EasyPeasyPDF-${{ steps.ver.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          body="${NOTES:-Easy Peasy PDF $v}"
          body="$body

          **Download:** \`EasyPeasyPDF-setup.exe\` (recommended: installs for your user, updates without admin rights) or \`EasyPeasyPDF.msi\` (per-machine, for IT)."
          if ! gh release create "v$v" release/* --target "$GITHUB_SHA" --title "Easy Peasy PDF $v" --notes "$body" --latest; then
            echo "::error::Could not create the release. The installers are attached to this run as artifacts. To allow releases: repo Settings -> Actions -> General -> Workflow permissions -> 'Read and write permissions' (if greyed out, an org owner enables it under the organization's Settings -> Actions -> General)."
            exit 1
          fi
